<?xml version="1.0" encoding="UTF-8"?>
<!--
  Tenshu mark — canonical SVG. Source for favicons, OG cards, anywhere outside
  React/Compose. Mirrors marks/Outline.tsx exactly: dome head with triangle
  "pagoda-eave" ears (reinstated in v7, see ADR 0004 which supersedes ADR
  0003), six outward whiskers, kaomoji ω mouth, dot eyes with catchlights.
  Uses currentColor so it inherits text color from the surrounding context.

  When Outline.tsx changes, regenerate this file from it — do NOT hand-edit
  paths separately.
-->
