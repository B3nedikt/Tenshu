# XcodeGen spec for the Contacts iOS app (docs/proposals/contacts-app.md §9.9 — Ph10).
# Mirrors maps-ios/project.yml. The generated `ContactsIos.xcodeproj` + `Info.plist` are
# gitignored (build from source, like the Kotlin framework + libsodium).
#
# Regenerate after editing:   ./gradlew generateContactsIosProject   (or: cd contacts-ios && xcodegen generate)
# Build (simulator):          xcodebuild -project ContactsIos.xcodeproj -scheme ContactsIos \
#                               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
#
# ⚠ Contacts is **born on route 1** (ios-first-party-route-1-migration.md — the phase map is
# complete, so this app never had an EPC tier to migrate off). `DEV_HARNESS` exists only for the
# render probes.
#
# ⚠ No `MapBearingApp` template: Contacts draws no map, so it takes neither MapLibre nor the tile
# payload. That include is what would pull ~40 MB of archive into an app that has nothing to plot.
name: ContactsIos
options:
  bundleIdPrefix: app.tenshu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  DebugHarness: debug
  Release: release

# The shared forward-to-Control surface (ADR 0022), applied below as
# `templates: [ControlOnboardingApp]`. Drive, Fit, Timeline and Maps include the same file.
# Contacts takes the *banner* half of it, not the full-screen gate: the list stays browsable over
# cached contacts (ADR §Decision 4 + §Decision 5).
#
# ⚠ Unlike `ios-basemap`, this include carries no payload — two Swift files and one build setting —
# so the "~40 MB of archive" objection recorded above for `MapBearingApp` does not apply here.
include:
  # The shared adaptive navigation shell (N6), applied as `templates: [AdaptiveAppShell]`.
  - path: ../ios-shell/shell.yml
  - path: ../ios-onboarding/onboarding.yml
  # The shared realm-storage banner (§8b.5c), applied below as `templates: [RealmStorageBanner]`.
  - path: ../ios-storage/storage.yml
  # Version numbers and orientations (`ReleaseApp`), and how Contacts links its OWN Kotlin framework
  # (`AppFramework`, `ios-per-app-frameworks.md` P4). Archived by `scripts/ios-archive.sh contacts`.
  - path: ../ios-release/release.yml
  # The open-source notices (`docs/oss-licences.md`), applied below as `templates: [OssLicences]`.
  - path: ../ios-about/about.yml

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Ad-hoc-signed on the SIMULATOR (CODE_SIGN_IDENTITY = "-"), matching the sibling iOS apps.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # Real-device (iphoneos) builds sign for the personal team (ios-signing.md §2/§3).
    CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "YES"
    CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
    CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
    DEVELOPMENT_TEAM[sdk=iphoneos*]: ${TENSHU_TEAM_ID}
    # Apple-silicon simulator only — matches `:tenshu-sdk-ios-contacts`'s arch set.
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  ContactsIos:
    type: application
    platform: iOS
    # The shared forward-to-Control surface (see the `include` above).
    templates:
      - AdaptiveAppShell
      - ControlOnboardingApp
      - RealmStorageBanner
      # Version numbers and orientations for an archived build (`ios-release/release.yml`).
      - ReleaseApp
      - OssLicences
      # ⚠ Contacts links `:tenshu-sdk-ios-contacts` (`ios-per-app-frameworks.md`
      # P4): a `TenshuSdk` built from Contacts' code and the shared core only.
      - AppFramework
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        # Lets canOpenURL("tenshu-control://services") answer truthfully so the realm-storage
        # banner can offer "Manage storage". ⚠⚠ Without this iOS reports Control absent even
        # when installed and the action silently disappears. ⚠ project.yml is the source;
        # Info.plist is generated and gitignored.
        LSApplicationQueriesSchemes:
          - tenshu-control
        CFBundleDisplayName: Tenshu Contacts
        # Export compliance (`docs/how-to/ios-testflight.md`): libsodium ships standard (IETF)
        # algorithms beside Apple's own, so App Store Connect's answer is "standard algorithms".
        ITSAppUsesNonExemptEncryption: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Route-1: the effective shared Keychain group RealmKeyMaterialBridge reads Control's
        # route-1 key material from (bare on the sim, Team-prefixed on device).
        TenshuSharedKeychainGroup: $(TENSHU_SHARED_KEYCHAIN_GROUP)
        # Tenshu Control's App Store product id, for the forward-to-Control surface
        # (ADR 0022). Empty until Control ships → the screen says so instead of opening
        # a broken page. Same build-setting → Info.plist path as the Keychain group above.
        TenshuControlAppStoreId: $(TENSHU_CONTROL_APP_STORE_ID)
        # This app's own App Store product id, for the skew fence's Update button
        # (core-schema-skew-surface.md §8.5). Empty until the listing exists → no button.
        TenshuAppStoreId: $(TENSHU_APP_STORE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tenshu.contacts.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Contacts.entitlements
        TENSHU_SHARED_KEYCHAIN_GROUP: app.tenshu.shared
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Contacts.device.entitlements
        TENSHU_SHARED_KEYCHAIN_GROUP[sdk=iphoneos*]: $(DEVELOPMENT_TEAM).app.tenshu.shared
        GENERATE_INFOPLIST_FILE: "NO"
        # Contacts' own static `TenshuSdk` framework — linked by search path and name (the
        # `AppFramework` template), not embedded.
        TENSHU_SDK_MODULE: tenshu-sdk-ios-contacts
      configs:
        DebugHarness:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV_HARNESS
    preBuildScripts:
      - name: Build TenshuSdk.framework
        # Keep the linked framework fresh before compile/link: one slice of Contacts' framework
        # (scripts/ios-build-sdk.sh).
        script: |
          "$SRCROOT/../scripts/ios-build-sdk.sh" contacts
        basedOnDependencyAnalysis: false

  # The store screenshots (docs/how-to/store-screenshots.md §3c): an XCUITest over the SHIPPING
  # app — the `Debug` configuration, no harness — that imports the fixture's vCards in one launch
  # (`-seedFixture`, data only) and captures the next. Run only through
  # `scripts/store-screenshots.sh contacts`, which runs Control's genesis on the same simulator first.
  ContactsIosScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Screenshots
      # AdaptiveAppShell's tab lookup, shared by every walk (bottom tabs, iPad top tabs, sidebar).
      - path: ../ios-shell/UITestSupport
    dependencies:
      - target: ContactsIos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tenshu.contacts.ios.screenshots
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: ContactsIos

schemes:
  ContactsIos:
    build:
      targets:
        ContactsIos: all
    run:
      config: Debug
  ContactsIos-Dev:
    build:
      targets:
        ContactsIos: all
    run:
      config: DebugHarness
  # Store screenshots — ⚠ `Debug`, NOT `DebugHarness`: the harness compiles the `-contactsScreen`
  # probes over the mock repository, and a listing must show the shipping app over a real realm.
  ContactsIos-Screenshots:
    build:
      targets:
        ContactsIos: all
        ContactsIosScreenshots: [test]
    test:
      config: Debug
      targets:
        - ContactsIosScreenshots
    run:
      config: Debug
