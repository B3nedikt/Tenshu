# iOS HTTP engine. The rendezvous relay client (RelayRendezvousTaskTransport,
# :sync-service-proxy) uses OkHttp on JVM/Android and Js on web; the Darwin
# engine is its iOS counterpart. Wired into the iOS client packaging in
# Phase 6b (docs/proposals/ios-proxy-architecture.md) — no iOS-exported
# module consumes an HttpClient engine yet.
ktorClientDarwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktorClientMock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# The JVM jar: desktop Control (jvmMain) and the IN-3 desktop harness (jvmTest).
onnxRuntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxRuntime" }
# ⚠⚠ A DIFFERENT ARTIFACT, not a variant. `com.microsoft.onnxruntime:onnxruntime` is a JVM jar with
# no native libraries for Android ABIs; the device needs this AAR, which ships a `.so` per ABI.
# Reusing the jar compiles and then fails at runtime with `UnsatisfiedLinkError` — a failure that
# looks like a device problem and is a dependency problem (`inference-service.md` §15.2).
onnxRuntimeAndroid = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxRuntime" }
# ⚠ Face detection + the 478-point mesh, from which IN-6's five alignment points are read
