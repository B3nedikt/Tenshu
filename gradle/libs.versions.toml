[versions]
# SKIE — Swift/Kotlin bridge applied to the :tenshu-sdk-ios-<app> frameworks only (root build)
# (Flow→AsyncSequence, suspend→async, sealed→enum). COMPILER-VERSION-COUPLED:
# Gate any Kotlin bump on SKIE support — see docs/tech-debt.md "SKIE ⨯ Kotlin
# version pin". 0.10.15 supports Kotlin 2.0.0 … 2.4.20 — and ⚠ NOT 2.4.21: SKIE lists
# each supported patch explicitly (`versionSupport.kotlin` in its gradle.properties), and
# 2.4.21 is absent. The repo pin is at the TOP of that range, so headroom is zero again.
# Check https://skie.touchlab.co/changelog before bumping.
skie = "0.10.15"

kotlin = "2.4.20"
ktor = "3.6.1"
agp = "9.5.0"
compose = "2026.09.00"
jetbrains-compose = "1.12.1"

appcompat = "1.8.0"
core-ktx = "1.19.1"
garmin-fit = "21.218.0"
health-connect = "1.1.0"
documentfile = "1.1.0"
kotlinx-coroutines = "1.11.0"
# The lock primitives only (`kotlinx.atomicfu.locks`), no compiler plugin. ⚠ On JVM/Android this
# entry is the ONLY request for atomicfu (coroutines-jvm does not use it), so it alone sets the
# version there. iOS conflict-resolves to the highest request in its graph, so keep this at least
# that high or the same lock runs on different versions per target.
kotlinx-atomicfu = "0.33.0"
kotlinx-datetime = "0.8.0"
lifecycle-runtime-compose = "2.11.0"
material3 = "1.4.0"
biometric = "1.1.0"
savedstate = "1.5.0"
androidx-sqlite = "2.7.1"
# Pinned deliberately: compose-bom does NOT manage androidx.activity, and the KMP
# UI modules apply no BOM at all, so an unversioned entry resolved to whatever
# transitive constraint happened to win (1.12.0 in :ui-core vs 1.12.4 elsewhere).
activity-compose = "1.13.0"

koin = "4.2.2"
koin-test = "4.2.2"
# ⚠ 2.14.0+ ships Java 21 bytecode (class major 65). Only `:drive-shared-ui` and `:drive-android`
# use it, and `:drive-shared-ui` therefore runs its tests on a JDK 21 (its build file). A new
# consumer on a 17 test JVM fails with `UnsupportedClassVersionError` at test time, not compile.
zoomable = "2.16.0"
junit = "4.13.2"
junit-version = "1.3.0"
espresso-core = "3.7.0"
lifecycle-runtime-ktx = "2.11.0"
kotlinx-io = "0.9.2"
kotlin-test = "2.4.20"
runner = "1.7.0"
core = "1.7.0"
androidx-test-core-ktx = "1.7.0"

nav3 = "1.2.0"
kotlinxSerialization = "1.11.0"
# MapLibre Compose — live vector-tile basemap (Maps Ph7b). Android AND iOS here
# (desktop target of the lib is ~15% complete → desktop keeps the schematic MapSnippet).
# ⚠ 0.15 swapped the MapLibre Android SDK for `maplibre-native-ffi`, so the render
# runtime is no longer transitive: Android must declare one explicitly (below), and
# the iOS apps carry its linker flags in their project.yml. 0.17+ requires Kotlin 2.4.20
# (SKIE-gated); 0.18+ requires iOS 15.5. ⚠ 0.20 raised the default max zoom of tile-URL
# sources to 22 — irrelevant while the basemap comes from style JSON (`resolveBasemapSource`),
# whose camera ceiling is `BASEMAP_MAX_ZOOM`.
maplibreCompose = "0.20.0"
paging = "3.5.3"
work-manager = "2.12.0"
robolectric = "4.17"
glance = "1.2.0"
qrose = "1.3.1"
# ZXing core: pure-Java QR decoding for `:ui-qr-scanner` on Android. Replaced ML Kit, whose
# bundled barcode model logs usage to Google (firebaselogging.googleapis.com) through datatransport.
zxing = "3.5.4"
play-billing = "9.1.0"
camerax = "1.6.2"

# BouncyCastle: JVM (desktop + Android) Ed25519 + X25519 + AEAD backend.
# Picked because Android's standard provider only adds Ed25519 at API 33+,
# and minSdk = 24 — BC works on every API level we ship and is identical
# code on desktop, so behaviour is uniform across JVM targets.
bouncycastle = "1.86"

# Apache PDFBox — desktop-only PDF page→bitmap rendering (drive-content-preview.md
# §4). The JVM has no built-in PDF renderer; Android uses android.graphics.pdf
# instead, so this dep is confined to drive-shared-ui's desktopMain source set.
pdfbox = "3.0.8"

# ONNX Runtime SHIPS: `:inference-service-proxy` runs the embedding models on it in
# Android Control (`onnxRuntimeAndroid`, androidMain) and desktop Control (`onnxRuntime`, jvmMain).
# Its native graph moved from test-scoped to shipped in IN-3b. ⚠ A bump is a runtime change under
# photo search, so it needs a phone re-index check. ⚠ It also grows Control: arm64
# `libonnxruntime.so` is 18.2 MB at 1.22.0 and 34.2 MB at 1.31.0. Held at 1.22.0 on purpose
# (2026-10-14) until a release brings a measured reason.
# ⚠⚠ 1.22.0 is a FLOOR, not a preference: below it `libonnxruntime4j_jni.so` is 4 KB-aligned, and Play
# refuses a bundle whose native libraries do not support 16 KB pages. `scripts/android-release.sh`
# checks every `.so` it ships.
onnxRuntime = "1.22.0"
# IN-6's detector + landmark half (`photos-people-and-pets.md` §7a), chosen on licence grounds
# (Apache-2.0, consented training data — `models.md` §5.9). ⚠⚠ In the SHIPPED Android graph since F2
# (2026-09-24), once the phone measurement said the pipeline is worth shipping (§12.6–§12.8b). It is
# an Android AAR only: desktop has no MediaPipe, which is why the face catalog entry's runtime
# (`FaceModel.RUNTIME`) is contributed on Android alone.
# ⚠⚠ 0.10.26 is the 16 KB-page floor (same Play rule as above). Since 0.10.35 the native library is
# `libmediapipe_tasks_jni.so` inside the transitive `tasks-core` AAR, not `…_tasks_vision_jni.so` in
# this one — check that artifact's alignment on a bump.
# ⚠ 1.x is a runtime swap, not a bump: it adds `com.google.ai.edge.litertlm:litertlm-android` (the
# LiteRT-LM engine, ~21 MB) and moves the natives there. It needs a face-pipeline re-measurement.
mediapipeTasksVision = "0.10.35"
# AboutLibraries — the open-source licence notices every app ships (`docs/oss-licences.md`). The plugin
# (root build) writes each app's dependency + licence JSON at build time; `:ui-core` parses it itself.
# ⚠ Not `aboutlibraries-core`: 15.2.0's JVM classes are Java 21 bytecode and the shared modules run
# on 17 (it fails at class load, measured).
aboutlibraries = "15.3.0"

# JVM servers (`:sync-relay-server`, `:commerce-service`).
logback = "1.6.6"
sqlite-jdbc = "3.53.4.0"
awssdk = "2.54.19"
s3mock = "4.12.4"

