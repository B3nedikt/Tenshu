# Eclipse Paho v3 — the hub's MQTT client for the zigbee2mqtt sidecar
# (home-device-service.md HD-2). Dependency-free pure JVM, unremarkable on ARM;
# HiveMQ's client was the alternative but drags Netty into a runtime with none.
# Behind the :hub `MqttClient` seam, so swapping it is a one-file change.
paho-mqtt-client = { module = "org.eclipse.paho:org.eclipse.paho.client.mqttv3", version = "1.2.5" }
