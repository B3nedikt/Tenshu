# The render backend, `runtimeOnly` on Android. OpenGL ES rather than Vulkan: it is
# available on every API level this app ships to (minSdk 24) and on the smoke gate's
# swiftshader emulator, where Vulkan is not.
maplibre-compose-runtime = { module = "org.maplibre.compose:maplibre-compose-runtime-opengl-android", version.ref = "maplibreCompose" }

