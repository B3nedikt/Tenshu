# XcodeGen spec for the Maps iOS app (docs/proposals/maps-app.md +
# docs/proposals/ios-fit-timeline-maps-parity.md §3.3 "Maps needs three units, not one" — P5).
# Mirrors timeline-ios/project.yml. The generated `MapsIos.xcodeproj` + `Info.plist` are
# gitignored (build from source, like the Kotlin framework + libsodium).
#
# Regenerate after editing:   ./gradlew generateMapsIosProject   (or: cd maps-ios && xcodegen generate)
# Build (simulator):          xcodebuild -project MapsIos.xcodeproj -scheme MapsIos \
#                               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
#
# ⚠ Maps is **born on route 1** (ios-first-party-route-1-migration.md P4 — the phase that was parked
# for want of a shell). It never had an EPC tier, so unlike Timeline/Fit there is no live-EPC pairing
# path here; `DEV_HARNESS` exists only for the render probes.
name: MapsIos
options:
  bundleIdPrefix: app.tenshu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

# Two build configs over one app target: the shipping `Debug` config is the app; `DebugHarness`
# additionally defines the `DEV_HARNESS` Swift compilation condition, which enables the launch-
# argument render probes (`-mapsScreen …`). The two schemes below pin each to its config.
configs:
  Debug: debug
  DebugHarness: debug
  Release: release

# Everything a map-bearing app owes beyond its Kotlin framework (D9) — the shared SwiftUI map layer,
# the MapLibre SPM package, and the tile archive + glyph atlas as bundle resources — arrives through
# ONE include, applied to the target below as `templates: [MapBearingApp]`. Maps is consumer #3
# (after fit-ios and timeline-ios) and needed nothing beyond these two lines: the place-detail point
# hero is the consumer.
include:
  - path: ../ios-basemap/basemap.yml
  # The shared forward-to-Control surface (ADR 0022), applied below as
  # `templates: [ControlOnboardingApp]`. Drive, Fit, Timeline and Contacts include the same file.
  # Maps takes the *banner* half of it, not the full-screen gate — its screens already explain
  # themselves in place, and a wall would replace those explanations with one generic screen
  # (ADR §Decision 5; Maps is the closest call and the ADR records why).
  - path: ../ios-onboarding/onboarding.yml
  # The shared realm-storage banner (§8b.5c), applied below as `templates: [RealmStorageBanner]`.
  - path: ../ios-storage/storage.yml
  # Version numbers and orientations (`ReleaseApp`), and how Maps links its OWN Kotlin framework
  # (`AppFramework`, `ios-per-app-frameworks.md` P4). Archived by `scripts/ios-archive.sh maps`.
  - path: ../ios-release/release.yml
  # The open-source notices (`docs/oss-licences.md`), applied below as `templates: [OssLicences]`.
  - path: ../ios-about/about.yml

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Ad-hoc-signed on the SIMULATOR (CODE_SIGN_IDENTITY = "-"), matching the sibling iOS apps.
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # Real-device (iphoneos) builds sign for the personal team (ios-signing.md §2/§3);
    # the simulator keeps the ad-hoc config above. Team ID from $TENSHU_TEAM_ID at
    # `xcodegen generate` time (local.properties tenshu.teamId).
    CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "YES"
    CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
    CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
    DEVELOPMENT_TEAM[sdk=iphoneos*]: ${TENSHU_TEAM_ID}
    # Apple-silicon simulator only — matches the Kotlin framework's arch set (no iosX64 because
    # paging-common ships no iosX64 klib).
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

targets:
  MapsIos:
    type: application
    platform: iOS
    # The shared map layer + MapLibre + the tile/glyph payload, and the shared
    # forward-to-Control surface (see the `include`s above).
    templates:
      - MapBearingApp
      - ControlOnboardingApp
      - RealmStorageBanner
      # Version numbers and orientations for an archived build (`ios-release/release.yml`).
      - ReleaseApp
      - OssLicences
      # ⚠ Maps links `:tenshu-sdk-ios-maps` (`ios-per-app-frameworks.md`
      # P4): a `TenshuSdk` built from Maps' code and the shared core only.
      - AppFramework
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        # Cross-app open (`control-cross-app-open.md` CO-D4, §5i). ⚠⚠ On iOS this URL is the
        # ONLY carrier: under route 1 every first-party app runs its own in-process proxy, so
        # there is no channel between two apps for a request to be pushed down.
        # ⚠⚠ The scheme is DERIVED from the appId (`app.tenshu.maps` -> `tenshu-maps`), never
        # authored — `OpenTargetUrl.schemeFor` is the single source and a test pins the mapping.
        # ⚠ This file is the source; `Info.plist` is generated and gitignored.
        CFBundleURLTypes:
          - CFBundleURLName: app.tenshu.maps.open
            CFBundleURLSchemes:
              - tenshu-maps
        # Lets canOpenURL("tenshu-control://services") answer truthfully so the realm-storage
        # banner can offer "Manage storage". ⚠⚠ Without this iOS reports Control absent even
        # when installed and the action silently disappears. ⚠ project.yml is the source;
        # Info.plist is generated and gitignored.
        LSApplicationQueriesSchemes:
          - tenshu-control
        CFBundleDisplayName: Tenshu Maps
        # Export compliance (`docs/how-to/ios-testflight.md`): libsodium ships standard (IETF)
        # algorithms beside Apple's own, so App Store Connect's answer is "standard algorithms".
        ITSAppUsesNonExemptEncryption: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ⚠ Maps does NOT use location: no "my location" control, `showsUserLocation = false` on
        # both renderers (ios-basemap), and no `CLLocationManager` or authorization request in Maps'
        # Swift or Kotlin, so this sheet never shows. The string is for App Store Connect: the
        # embedded MapLibre.framework links CoreLocation for its own user-location feature, and an
        # app that carries location code owes a purpose string (ios-per-app-frameworks.md §10.4).
        # Measured on the first archive (2026-10-17): Maps' executable loads no CoreLocation, but
        # MapLibre's binary does and references `requestWhenInUseAuthorization` AND
        # `requestAlwaysAuthorization`, so both keys are declared. MapLibre is a prebuilt binary
        # from SPM, so the link cannot be dropped from here. They say what is true; if Maps ever
        # shows the user's position, rewrite them in the same change.
        NSLocationWhenInUseUsageDescription: Maps does not use your location. The map engine it is built on can show your position, but Maps never turns that on or asks for access.
        NSLocationAlwaysAndWhenInUseUsageDescription: Maps does not use your location. The map engine it is built on can show your position, but Maps never turns that on or asks for access.
        # Route-1 (ios-first-party-route-1-migration.md P4): the effective shared Keychain group
        # RealmKeyMaterialBridge reads Control's route-1 key material from (bare on the sim,
        # Team-prefixed on device — set per-sdk in settings below).
        TenshuSharedKeychainGroup: $(TENSHU_SHARED_KEYCHAIN_GROUP)
        # Tenshu Control's App Store product id, for the forward-to-Control surface
        # (ADR 0022). Empty until Control ships → the screen says so instead of opening
        # a broken page. Same build-setting → Info.plist path as the Keychain group above.
        TenshuControlAppStoreId: $(TENSHU_CONTROL_APP_STORE_ID)
        # This app's own App Store product id, for the skew fence's Update button
        # (core-schema-skew-surface.md §8.5). Empty until the listing exists → no button.
        TenshuAppStoreId: $(TENSHU_APP_STORE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tenshu.maps.ios
        # Route-1 entitlements (Keychain + App Group) — sim uses the bare group, device uses the
        # Team-prefixed Keychain group and the same bare App Group id.
        CODE_SIGN_ENTITLEMENTS: Maps.entitlements
        TENSHU_SHARED_KEYCHAIN_GROUP: app.tenshu.shared
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Maps.device.entitlements
        TENSHU_SHARED_KEYCHAIN_GROUP[sdk=iphoneos*]: $(DEVELOPMENT_TEAM).app.tenshu.shared
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        # Maps' own static `TenshuSdk` framework — linked by search path and name (the
        # `AppFramework` template), not embedded.
        TENSHU_SDK_MODULE: tenshu-sdk-ios-maps
      configs:
        # Only the harness config compiles the launch-argument render probes.
        # `$(inherited)` keeps the `DEBUG` the debug-config preset already sets.
        DebugHarness:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DEV_HARNESS
    preBuildScripts:
      - name: Build TenshuSdk.framework
        # Keep the linked framework fresh before compile/link: one slice of Maps' framework
        # (scripts/ios-build-sdk.sh).
        script: |
          "$SRCROOT/../scripts/ios-build-sdk.sh" maps
        basedOnDependencyAnalysis: false

schemes:
  # Shipping app.
  MapsIos:
    build:
      targets:
        MapsIos: all
    run:
      config: Debug
  # Dev/test harness: adds the `-mapsScreen` render probes.
  MapsIos-Dev:
    build:
      targets:
        MapsIos: all
    run:
      config: DebugHarness
