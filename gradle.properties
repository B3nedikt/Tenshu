#Gradle
# ⚠⚠ Do NOT try to fix a "Malformed input or input contains unmappable characters" build
# failure by adding `-Dsun.jnu.encoding=UTF-8` here. It does nothing: unlike
# `file.encoding`, `sun.jnu.encoding` is set by the JVM from the OS locale during startup
# and a command-line `-D` for it is silently overwritten (verified: `java
# -Dsun.jnu.encoding=UTF-8 -XshowSettings:properties` still reports ANSI_X3.4-1968 under a
# POSIX locale). Only the environment — `LANG` / `LC_ALL` — changes it.
#
# That property is what encodes FILE PATHS (`sun.nio.fs.UnixPath.encode`), and a Kotlin
# test declared with backticks becomes a class *file* named after it. So a single non-ASCII
# character in a test name makes a whole module uncompilable on any machine whose locale is
# not UTF-8, with an error that never mentions encoding. The build therefore keeps test
# names ASCII rather than depending on the developer's locale — see
# `NonAsciiTestNameTest`, which fails with an explanation if one creeps back in.
# ⚠⚠ The flags after the -Xmx do not shrink any ceiling, they make an IDLE process give memory
# back (docs/tech-debt.md "Idle build processes hold the machine's RAM", the 2026-10-14 panic):
#  - G1PeriodicGCInterval: a daemon that has not collected for 60 s runs a concurrent cycle and
#    uncommits the free heap. Without it a daemon keeps its high-water heap resident until it exits.
#  - kotlin.daemon.options: the Kotlin daemon outlives its last compile by 7200 s by default, 12x
#    the Gradle idle timeout below. 600 s matches it. ⚠ It also runs on ParallelGC, which never
#    uncommits; moving it to G1 is NOT done here: `-XX:+UseG1GC` beside a ParallelGC the plugin adds
#    is a hard JVM error ("Conflicting collector combinations"), so that needs a measured compile.
org.gradle.jvmargs=-Xmx5096M -Dfile.encoding=UTF-8 -XX:G1PeriodicGCInterval=60000 -Dkotlin.daemon.jvm.options\="-Xmx4096M" -Dkotlin.daemon.options\=autoshutdownIdleSeconds=600
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Local build cache (~/.gradle/caches/build-cache-1, shared by every checkout on the machine).
# One agent session per worktree means each new worktree used to compile all ~190 modules from
# scratch, even when the same sources had been compiled an hour earlier in another one. With the
# cache, a fresh worktree takes unchanged modules' outputs from it instead.
# ⚠ It saves build TIME, not disk: each worktree still materialises its own `build/` dirs.
# ⚠⚠ Test tasks are opted OUT in the root build.gradle.kts — `scripts/run-gate.sh` counts test
# tasks that executed, and a test restored FROM-CACHE verified nothing in this run.
# ⚠ A custom task that opts in (@CacheableTask / cacheIf) must declare every value it bakes in as
# an input, or another checkout's output is served for it. The config generators (relay URL, team
# id, store links) already do; ad-hoc `doLast`/`Exec` tasks are never cached.
org.gradle.caching=true

# ⚠⚠ The two settings below exist because the unit of concurrency here is the BUILD, not the
# task, and nothing in Gradle knows that. A daemon serves one build at a time, so N concurrent
# builds — the normal working style in this repo, one agent session per worktree — force N
# daemons, each with its own `org.gradle.jvmargs` ceiling above and its own worker pool. Measured
# 2026-08-15 on the 24 GiB/14-core dev box: 5 live daemons (one per checkout), 4.98 GiB of heap
# ceiling each = 24.9 GiB from daemons alone, 46 daemons spawned in 24 h, 12 MB of RAM free and
# 18.2 GB of 19.5 GB swap in use. Two daemon logs that week end in "The Daemon will expire
# immediately since the JVM garbage collector is thrashing", one of them followed by
# `D8: java.lang.OutOfMemoryError: Java heap space`.
#
# ⚠ Do NOT "fix" that by lowering `org.gradle.jvmargs`. The failing daemon was at its configured
# 4.9 GiB ceiling, so a smaller heap trades OOM-from-the-machine for OOM-from-the-ceiling — see
# docs/tech-debt.md, which reasons about *raising* it and is right for one build and wrong for
# five. The multiplier is the problem; the per-daemon size is not.

# Reclaim an idle daemon after 10 min instead of Gradle's 3 h default (30 min until 2026-10-14:
# with three or four sessions building, half an hour of idle daemons was several GB nobody used). With one daemon per
# worktree, the default means every daemon a session ever started stays resident, at its full
# grown heap, for the rest of the working day: the 4 idle daemons measured above held 4.88 GB RSS
# between them while doing nothing at all.
org.gradle.daemon.idletimeout=600000

# Bound each daemon's worker pool. Unset, this defaults to the CPU count (14), which is a
# sensible number for one build and 70 concurrent workers across five — on 14 cores. Each Test
# task forks its own JVM at Gradle's default 512 MB (no module overrides `Test.maxHeapSize`), so
# the worker cap is also the test-fork cap: 14 → up to ~7 GB of forks per daemon, 6 → ~3 GB.
# ⚠ This costs a solo build some width. If you are the only session on the machine and want it
# back, override per-invocation with `--max-workers=14` rather than editing this line.
org.gradle.workers.max=6

#Kotlin
kotlin.code.style=official
kotlin.native.jvmArgs=-Xmx4G

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.uniquePackageNames=false
android.r8.strictFullModeForKeepRules=false
android.builtInKotlin=true
android.newDsl=true
android.dependency.useConstraints=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false

#MPP
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.androidSourceSetLayoutVersion=2
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Control's Google Play page — the "Get Tenshu Control" link the other nine apps show a copy that came
# from Play (ADR 0025; it is offered only to a Play-installed copy). Live since the open test, 2026-10-28.
tenshu.control.playUrl=https://play.google.com/store/apps/details?id=app.tenshu.control.android
# Each app's own Play listing, for the schema-skew fence's Update button on a Play copy
# (core-schema-skew-surface.md §8.5): tenshu.<app>.playUrl for drive, photos, maps, timeline, fit,
# calendar, contacts, home and mia. ⚠ Unset = no button. Set one only once its listing answers an
# anonymous request: a configured link to an unpublished listing is a dead button.

# Minimum macOS for every desktop bundle and every helper compiled into one (D10,
# docs/proposals/desktop-macos-distribution.md). ⚠ swiftc without an explicit `-target` takes the
# BUILD Mac's own version as the minimum, so a helper built on the newest macOS refuses to launch
# on anything older. App Store Connect also refuses an arm64-only app whose minimum is below 12.0.
# The floor is the bundled ONNX Runtime (13.3), rounded up to the next major version.
tenshu.macosDeploymentTarget=14.0
