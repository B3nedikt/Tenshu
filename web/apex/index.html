<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tenshu: Your apps. Your data. Your control.</title>
    <meta
      name="description"
      content="Open-source app platform where you decide what every app can see and do. End-to-end encrypted across your devices."
    />

    <link rel="icon" type="image/svg+xml" href="/icons/tenshu.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph (Slack, Discord, iMessage, LinkedIn, Mastodon, Bluesky, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tenshu" />
    <meta property="og:title" content="Tenshu: Your apps. Your data. Your control." />
    <meta
      property="og:description"
      content="Open-source app platform where you decide what every app can see and do. End-to-end encrypted across your devices."
    />
    <meta property="og:url" content="https://tenshu.app/" />
    <meta property="og:image" content="https://tenshu.app/og.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tenshu: Your apps. Your data. Your control." />

    <!-- Twitter / X cards. The platform still reads `twitter:*` tags despite the rebrand;
         falls back to og:* when these are absent. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tenshu: Your apps. Your data. Your control." />
    <meta
      name="twitter:description"
      content="Open-source app platform where you decide what every app can see and do. End-to-end encrypted across your devices."
    />
    <meta name="twitter:image" content="https://tenshu.app/og.svg" />
    <meta name="twitter:image:alt" content="Tenshu: Your apps. Your data. Your control." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
