    <path d="M16 26h32M32 26v22" stroke="#0f172a" stroke-width="5" stroke-linecap="round"/>
    <text x="84" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
