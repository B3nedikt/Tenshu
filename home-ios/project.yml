# XcodeGen spec for the Home iOS app (docs/proposals/home-and-mia-apps.md §3/§8).
# Mirrors calendar-ios/project.yml. The generated `HomeIos.xcodeproj` + `Info.plist` are gitignored.
#
# Regenerate after editing:   ./gradlew generateHomeIosProject   (or: cd home-ios && xcodegen generate)
# Build (simulator):          xcodebuild -project HomeIos.xcodeproj -scheme HomeIos \
#                               -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' build
#
# ⚠ Home runs on **route 1** (`HomeLocalRuntime`): its own in-process proxy over the replica
# Control provisions. READ-ONLY in this slice — devices with their last-synced state, the
# hub/storage tile, the automation list and run history. No device control, no pairing and no
# automation editing yet; the editor stays Android/desktop-only.
#
# ⚠⚠ This file used to say "Mock-only: no entitlements". A shell with no entitlements has no
# Keychain, so the route-1 gate could never see provisioning — and the mock it rendered instead
# was a fabricated household on a phone nothing had set up.
name: HomeIos
options:
  bundleIdPrefix: app.tenshu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED[sdk=iphoneos*]: "YES"
    CODE_SIGN_STYLE[sdk=iphoneos*]: Automatic
    CODE_SIGN_IDENTITY[sdk=iphoneos*]: "Apple Development"
    DEVELOPMENT_TEAM[sdk=iphoneos*]: ${TENSHU_TEAM_ID}
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

include:
  # The shared adaptive navigation shell (N6), applied as `templates: [AdaptiveAppShell]`.
  - path: ../ios-shell/shell.yml
  # The shared forward-to-Control surface (ADR 0022), applied as `templates: [ControlOnboardingApp]`.
  - path: ../ios-onboarding/onboarding.yml
  # The shared realm-storage banner (§8b.5c) and the sync-activity capsule beside it
  # (`ios-sync-activity-indicator.md` §6a.2), applied below as `templates: [RealmStorageBanner]`.
  - path: ../ios-storage/storage.yml
  # Version numbers and orientations (`ReleaseApp`), and how Home links its OWN Kotlin framework
  # (`AppFramework`, `ios-per-app-frameworks.md` P4). Archived by `scripts/ios-archive.sh home`.
  - path: ../ios-release/release.yml
  # The open-source notices (`docs/oss-licences.md`), applied below as `templates: [OssLicences]`.
  - path: ../ios-about/about.yml

targets:
  HomeIos:
    type: application
    platform: iOS
    templates:
      - AdaptiveAppShell
      - ControlOnboardingApp
      - RealmStorageBanner
      # Version numbers and orientations for an archived build (`ios-release/release.yml`).
      - ReleaseApp
      - OssLicences
      # ⚠ Home links `:tenshu-sdk-ios-home` (`ios-per-app-frameworks.md`
      # P4): a `TenshuSdk` built from Home's code and the shared core only.
      - AppFramework
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        # ⚠ What makes the storage banner's "Manage storage" action appear: without it
        # `canOpenURL` reports Control as absent even when it is installed (`ios-storage/storage.yml`).
        LSApplicationQueriesSchemes:
          - tenshu-control
        CFBundleDisplayName: Tenshu Home
        # Export compliance (`docs/how-to/ios-testflight.md`): libsodium ships standard (IETF)
        # algorithms beside Apple's own, so App Store Connect's answer is "standard algorithms".
        ITSAppUsesNonExemptEncryption: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # ⚠ This file is the source; `Info.plist` is generated and gitignored.
        # Route-1: the effective shared Keychain group RealmKeyMaterialBridge reads Control's
        # route-1 key material from (bare on the sim, Team-prefixed on device).
        TenshuSharedKeychainGroup: $(TENSHU_SHARED_KEYCHAIN_GROUP)
        # Tenshu Control's App Store product id, for the forward-to-Control surface (ADR 0022).
        TenshuControlAppStoreId: $(TENSHU_CONTROL_APP_STORE_ID)
        # This app's own App Store product id, for the skew fence's Update button
        # (core-schema-skew-surface.md §8.5). Empty until the listing exists → no button.
        TenshuAppStoreId: $(TENSHU_APP_STORE_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tenshu.home.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Home.entitlements
        TENSHU_SHARED_KEYCHAIN_GROUP: app.tenshu.shared
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: Home.device.entitlements
        TENSHU_SHARED_KEYCHAIN_GROUP[sdk=iphoneos*]: $(DEVELOPMENT_TEAM).app.tenshu.shared
        GENERATE_INFOPLIST_FILE: "NO"
        # Home's own static `TenshuSdk` framework — linked by search path and name (the
        # `AppFramework` template), not embedded.
        TENSHU_SDK_MODULE: tenshu-sdk-ios-home
    preBuildScripts:
      - name: Build TenshuSdk.framework
        # Keep the linked framework fresh before compile/link: one slice of Home's framework
        # (scripts/ios-build-sdk.sh).
        script: |
          "$SRCROOT/../scripts/ios-build-sdk.sh" home
        basedOnDependencyAnalysis: false

schemes:
  HomeIos:
    build:
      targets:
        HomeIos: all
    run:
      config: Debug
