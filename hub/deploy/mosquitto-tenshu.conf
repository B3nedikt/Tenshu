# mosquitto configuration for a Tenshu Hub node (home-device-service.md HD-2).
# Install: /etc/mosquitto/conf.d/tenshu.conf — see docs/how-to/hub-pi-deploy.md §7.
#
# ⚠ LOOPBACK ONLY. The broker exists to join two processes on ONE machine
# (zigbee2mqtt and tenshu-hub); it is not a home-automation bus for the LAN.
# Binding it to 0.0.0.0 would hand anyone on the network the ability to
# actuate every device and to watch the household's occupancy signals in
# plaintext — and it would contradict the hub's no-listener posture
# (hub proposal §11: the hub itself never listens; the two sidecar processes
# talk over loopback only).
#
# If you ever DO need a LAN listener (a second radio node, say), then
# `allow_anonymous false` plus a password file is the minimum, and TLS is the
# real answer. Do not simply delete the bind_address line.

listener 1883 127.0.0.1
allow_anonymous true

# No persistence: every piece of state here is derivable — zigbee2mqtt
# re-publishes its retained topics on start, and the hub re-derives its
# inventory from them. Nothing of value is lost across a broker restart, and
# nothing about the household is written to disk by the broker.
persistence false

log_dest stderr
log_type warning
log_type error
