name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    # ⚠ Pinned, not `ubuntu-latest`: GitHub moves that label to Ubuntu 26.04 from 2026-10-19, and
    # the pinned Playwright refuses to install its browser there ("does not support
    # chromium-headless-shell on ubuntu26.04-x64"). Move the pin on purpose, with the tools that
    # need it, rather than finding out from a red run.
    runs-on: ubuntu-24.04
    # ⚠ A hang must not hold the runner for hours: the full `check` takes ~30 min here.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The machine-wide gate lock every local gate script queues on (scripts/lib/gate-lock.sh),
      # incl. the self-deadlock when a caller wraps a script in lockf/flock by hand.
      - name: Gate lock
        run: bash scripts/test_gate_lock.sh

      # ⚠⚠ TWO JDKs. The second is a PIN, not a fix — read why before removing it.
      #
      # 17 is what the shared modules' `jvmToolchain(17)` compiles against, and it stays the
      # Gradle DAEMON's JVM — setup-java makes the LAST listed version JAVA_HOME, so listing 25
      # first deliberately does NOT move the daemon to 25.
      #
      # 25 is `FFM_JDK` in control-desktop / drive-desktop / macos-helpers, and the two desktop
      # modules resolve a launcher for it EAGERLY at configuration time
      # (`javaToolchains.launcherFor { … }.get()` — control-desktop/build.gradle.kts:176) so
      # jpackage embeds a 25 runtime rather than the daemon's. This build sets no
      # configure-on-demand, so EVERY invocation configures those projects — `check` included.
      #
      # ⚠⚠ Without this pin the build does NOT fail: `settings.gradle.kts` applies
      # `org.gradle.toolchains.foojay-resolver-convention`, so Gradle AUTO-PROVISIONS the missing
      # 25 — it downloads a JDK, at configuration time, before any task runs. That is why this
      # lane was green on JDK 17 alone. The pin buys three things: no ~200 MB download per cold
      # runner, no dependency on foojay/Adoptium being reachable for the build to CONFIGURE, and
      # an explicit record of which JDKs this build actually needs.
      #
      # ⭐ Verified 2026-08-25 with the resolver unreachable and no local 25: `check`,
      # `iosSimulatorArm64Test` and `:tenshu-sdk-js:jsBrowserDistribution` each die at
      # `--dry-run` with "Cannot find a Java installation … {languageVersion=25 …}", and each
      # configures cleanly once a 25 is present. So the pin is exactly what stands between a
      # foojay outage and every Gradle lane failing before a single task runs.
      - name: Set up JDK 25 (desktop FFM toolchain) + JDK 17 (daemon + shared modules)
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            17
          distribution: 'temurin'

      # Gradle's own cache action: Gradle's user home (dependencies, wrapper, and the local BUILD
      # cache, so a compile already done for these inputs is not redone). It replaces setup-java's
      # `cache: gradle`, which kept dependencies only. ⚠ By default only the default branch WRITES
      # the cache; PRs read it — so a run on master is what warms it.
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      # ⚠ setup-java installs into the hosted tool cache, which is NOT a location Gradle's
      # toolchain auto-detection scans — so the 25 above is invisible to `launcherFor` without
      # this. `fromEnv` takes env var NAMES; setup-java exports JAVA_HOME_<version>_<arch> and
      # the arch differs per runner (ubuntu = X64, macos-latest = ARM64), so both spellings are
      # listed. Unset names are skipped silently (verified), so the unused half costs nothing.
      #
      # ⚠⚠ And a heap and worker budget for THIS runner (4 cores, 16 GB). `gradle.properties` is
      # tuned for the maintainer's Mac (a 5 GB daemon, a 4 GB Kotlin daemon, 6 workers), and with
      # `--continue` reaching the heavy tasks the runner was shut down mid-build, twice, at ~30
      # min ("The runner has received a shutdown signal"). A user-home `gradle.properties`
      # overrides the project's. ⚠⚠ `tenshu.testMaxHeap` is the half that matters most: unset,
      # every test JVM takes a quarter of RAM (4 GB here), and 3 workers + 2 daemons is ~19 GB
      # on a 16 GB runner — it was then "lost communication" at ~20 min. At 3 workers × 2 GB it
      # still got lost (at ~70 min: lint, Kotlin compiles and Chrome share the rest), so 2 workers:
      # 2 × 2 + 4 + 3 = 11 GB.
      - name: Register both JDKs with Gradle toolchain detection; fit the build to the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_25_ARM64,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
          org.gradle.workers.max=2
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:G1PeriodicGCInterval=60000 -Dkotlin.daemon.jvm.options=-Xmx3g
          tenshu.testMaxHeap=2g
          PROPS

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run all checks
        # 'check' runs unit tests and lint for both Android and multiplatform targets.
        # It's faster than 'build' because it skips assembly (building APKs/AARs).
        #
        # ⚠⚠ Minus the known-red JS suites in `scripts/js-test-exclusions.txt` — the SAME list the
        # local gate (`scripts/run-gate.sh`) skips. Without it this lane ran exactly the suites the
        # gate excluded and was red on every run from the first public release on, so a real break
        # here read as more of the same (docs/tech-debt.md "Public CI was red on every run").
        run: |
          excluded=""
          # ⚠ `jsBrowserTest`, not the `jsTest` the gate excludes: `check` reaches the browser run
          # through `allTests`, which depends on it directly, so `-x :m:jsTest` still runs it.
          for m in $(sed -e 's/#.*//' scripts/js-test-exclusions.txt); do excluded="$excluded -x :$m:jsBrowserTest"; done
          # ⚠ `--continue`: without it `check` stops at the first failing task, so a run shows one
          # red and hides every task behind it — the reds then surface one CI run at a time.
          # One line a minute of memory and disk, IN this step's output: a runner that is lost leaves
          # its last readings in the log (a later "print the log" step never runs then).
          while true; do
            echo "[resources] $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/{print "mem used " $3 " / " $2 " MB, avail " $7}') $(df -h / | awk 'NR==2{print "disk " $3 " / " $2}')"
            sleep 60
          done &
          ./gradlew check --continue --stacktrace $excluded

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: "**/build/reports/tests/**"

  # iOS K/N build + test now lives in its own lane (`.github/workflows/ios.yml`)
  # on a macOS runner — it compiles the shared surface, runs the simulator
  # tests, and links every app's own iOS framework.
