name: Web CI

on:
  push:
    branches: ["master"]
    paths:
      - "web/**"
      - "tenshu-sdk-js/**"
      - ".github/workflows/web.yml"
      # The support pages resolve their screenshots through these (support-pages/generate.ts).
      - "store/*/screenshots.manifest.json"
      # ⚠⚠ EVERY module `:tenshu-sdk-js` api-depends on, one entry each. A change
      # in any of them invalidates the bundle and therefore the apex build, so a
      # missing entry is not "one fewer CI run" — it is a Kotlin-side regression
      # reaching the web with nothing between it and the deploy.
      #
      # ⚠ This list is DERIVED, not curated: `webCiPaths.test.ts` reads the
      # `api(project(":…"))` declarations out of `tenshu-sdk-js/build.gradle.kts`
      # and fails if either list here does not cover them (and if the two lists
      # differ). Adding a dependency always edits that build file, which always
      # matches `tenshu-sdk-js/**` above, so the guard cannot be outrun by the
      # very change it exists to catch.
      #
      # ⚠ Spelled out rather than globbed (`core*/**` etc.) on purpose. A glob
      # would silently rope in Android-only siblings — core-aidl, core-proxy,
      # the *-test-utils modules — and pay a full Kotlin/JS build for changes
      # that cannot affect the bundle. Precision is affordable because the test
      # keeps it honest; curation without the test is what produced the gap.
      - "app-error-handling/**"
      - "contact-service/**"
      - "contact-service-client/**"
      - "contact-service-common/**"
      - "contact-service-proxy/**"
      - "core/**"
      - "core-client/**"
      - "core-common/**"
      - "diagnostics/**"
      - "file-service/**"
      - "file-service-client/**"
      - "file-service-common/**"
      - "file-service-proxy/**"
      - "preference-service/**"
      - "preference-service-client/**"
      - "preference-service-common/**"
      - "preference-service-proxy/**"
      - "identity-service/**"
      - "identity-service-client/**"
      - "identity-service-common/**"
      - "identity-service-proxy/**"
      - "ingest-service/**"
      - "ingest-service-client/**"
      - "ingest-service-common/**"
      - "notification-service/**"
      - "notification-service-client/**"
      - "notification-service-common/**"
      - "notification-service-proxy/**"
      - "storage-service/**"
      - "storage-service-client/**"
      - "storage-service-common/**"
      - "storage-service-proxy/**"
      - "sync-service/**"
      - "sync-service-client/**"
      - "sync-service-common/**"
      - "sync-service-proxy/**"
      - "timeline-service/**"
      - "timeline-service-client/**"
      - "timeline-service-common/**"
      - "timeline-service-proxy/**"
      - "timeline-projection/**"
      - "fit-projection/**"
      - "fit-shared-file/**"
      - "calendar-service/**"
      - "calendar-service-common/**"
      - "calendar-service-client/**"
      - "calendar-service-proxy/**"
      - "health-service/**"
      - "health-service-common/**"
      - "health-service-client/**"
      - "health-service-proxy/**"
      - "place-service/**"
      - "place-service-common/**"
      - "place-service-client/**"
      - "place-service-proxy/**"
      - "map-region-service/**"
      - "map-region-service-common/**"
      - "map-region-service-client/**"
      - "map-region-service-proxy/**"
      - "map-region-app/**"
      - "vector-tile/**"
      - "basemap-core/**"
      - "photo-service/**"
      - "photo-service-common/**"
      - "photo-service-client/**"
      - "photo-service-proxy/**"
      - "inference-service/**"
      - "inference-service-common/**"
      - "inference-service-client/**"
      - "mia-service/**"
      - "mia-service-common/**"
      - "mia-service-client/**"
      - "mia-service-proxy/**"
      - "home-device-service-proxy/**"
      - "inference-service-proxy/**"
      - "routine-service/**"
      - "routine-service-common/**"
      - "routine-service-client/**"
      - "home-device-service/**"
      - "home-device-service-common/**"
      - "home-device-service-client/**"
      - "hub-management-service/**"
      - "hub-management-service-common/**"
      - "hub-management-service-client/**"
      - "logging-service/**"
      - "logging-service-common/**"
      - "logging-service-client/**"
  pull_request:
    branches: ["master"]
    # ⚠ Must stay identical to the push list above — GitHub Actions does not
    # support YAML anchors in workflow files, so the duplication is forced.
    # `webCiPaths.test.ts` asserts the two are the same set; a PR-only gap would
    # be the worse half to lose, since that is where a regression is still cheap.
    paths:
      - "web/**"
      - "tenshu-sdk-js/**"
      - ".github/workflows/web.yml"
      # The support pages resolve their screenshots through these (support-pages/generate.ts).
      - "store/*/screenshots.manifest.json"
      - "app-error-handling/**"
      - "contact-service/**"
      - "contact-service-client/**"
      - "contact-service-common/**"
      - "contact-service-proxy/**"
      - "core/**"
      - "core-client/**"
      - "core-common/**"
      - "diagnostics/**"
      - "file-service/**"
      - "file-service-client/**"
      - "file-service-common/**"
      - "file-service-proxy/**"
      - "preference-service/**"
      - "preference-service-client/**"
      - "preference-service-common/**"
      - "preference-service-proxy/**"
      - "identity-service/**"
      - "identity-service-client/**"
      - "identity-service-common/**"
      - "identity-service-proxy/**"
      - "ingest-service/**"
      - "ingest-service-client/**"
      - "ingest-service-common/**"
      - "notification-service/**"
