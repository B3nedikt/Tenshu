# Only the latest commit on a PR / branch needs to be tested. Older
# in-flight runs are cancelled.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + lint + test + build
    # ⚠ Pinned, not `ubuntu-latest`: GitHub moves that label to Ubuntu 26.04 from 2026-10-19, and
    # the pinned Playwright refuses to install its browser there ("does not support
    # chromium-headless-shell on ubuntu26.04-x64"). Move the pin on purpose, with the tools that
    # need it, rather than finding out from a red run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # ⚠⚠ A PIN, not a fix. control-desktop / drive-desktop resolve an `FFM_JDK = 25` launcher
      # eagerly at CONFIGURATION time and there is no configure-on-demand, so every invocation
      # configures them. Without the pin this does not fail — the foojay resolver in
      # settings.gradle.kts auto-provisions 25 by DOWNLOADING it mid-configuration, which is why
      # JDK 17 alone was green. Pinning removes that per-run download and the network dependency.
      # 17 is listed LAST so it stays the daemon JVM. Full reasoning in android.yml.
      - name: Set up JDK 25 (desktop FFM toolchain) + JDK 17 (daemon + shared modules)
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            17
          distribution: "temurin"

      # Gradle's own cache action: Gradle's user home (dependencies, wrapper, and the local BUILD
      # cache). It replaces setup-java's `cache: gradle`, which kept dependencies only. ⚠ By default
      # only the default branch WRITES the cache; PRs read it.
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      # ⚠ setup-java installs into the hosted tool cache, which is NOT a location Gradle's
      # toolchain auto-detection scans — so the 25 above is invisible to `launcherFor` without
      # this. `fromEnv` takes env var NAMES; setup-java exports JAVA_HOME_<version>_<arch> and
      # the arch differs per runner (ubuntu = X64, macos-latest = ARM64), so both spellings are
      # listed. Unset names are skipped silently (verified), so the unused half costs nothing.
      - name: Register both JDKs with Gradle toolchain detection
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_25_ARM64,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64" >> ~/.gradle/gradle.properties

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      # ⚠ 22, not 20 — this is a floor the test toolchain imposes, not a preference.
      # jsdom 30 declares `node: ^22.22.2 || ^24.15.0 || >=26.0.0` and does not merely
      # warn below it: on Node 20 it throws at import time (`webidl.util.markAsUncloneable
      # is not a function`, from undici inside jsdom/lib/api.js), so BOTH vitest steps
      # below collect zero tests and report N errors rather than N failures. Verified on
      # node:20-slim against jsdom 29 (26/26 green) and 30 (0 tests, 26 errors).
      # `pnpm install --frozen-lockfile` does NOT enforce `engines`, so nothing upstream
      # of this line catches an engine-floor bump — see web/package.json's `engines`.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The web/apex package imports the Kotlin/JS bundle from
      # tenshu-sdk-js/build/dist/... — see web/sdk/src/_bundle.ts and the
      # `feedback_web_dev_per_worktree_bundle` note. Every CI run rebuilds
      # the bundle so a Kotlin-side regression is caught here, not at
      # `pnpm test`/`pnpm build` time.
      - name: Build :tenshu-sdk-js bundle
        run: ./gradlew :tenshu-sdk-js:jsBrowserDistribution --stacktrace

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint apex
        working-directory: web
        run: pnpm -F apex lint

      - name: Typecheck + build apex
        working-directory: web
        run: pnpm -F apex build

      - name: Test apex
        working-directory: web
        run: pnpm -F apex test

      # The shared app-kit every app builds on (web-app-suite.md F3): lint, typecheck, and its own
      # tests — among them the guard that it value-imports nothing from `@tenshu/sdk` but `/bridge`.
      - name: Lint + typecheck + test app-kit
        working-directory: web
        run: |
          pnpm -F @tenshu/app-kit lint
          pnpm -F @tenshu/app-kit typecheck
          pnpm -F @tenshu/app-kit test

      # The shared map renderer (web-app-suite.md W-MAP): Maps, Timeline and Fit render through it. Not
      # an app (no vite.config.ts at its root), so the discovery loop below does not reach it.
      - name: Lint + typecheck + test map-kit
        working-directory: web
        run: |
          pnpm -F @tenshu/map-kit lint
          pnpm -F @tenshu/map-kit typecheck
          pnpm -F @tenshu/map-kit test

      # Every app package (ADR 0020 — own origin, own Vite / Tailwind / Router / Query stack) gets
      # the exact `pnpm -F apex` trio above. ⚠ DISCOVERED, not listed (web-app-suite.md F4): a
      # `web/<id>` with a vite.config.ts is an app — the rule scripts/run-web-gate.sh and
      # deploy/lib/web-apps.sh use — so a new app is linted, built and tested by existing. A
      # hard-coded list is how `web/drive` went unlinted and untested in CI until its third phase.
      # (A loop rather than a matrix: each matrix job would rebuild the Gradle SDK bundle above.)
      - name: Lint + typecheck/build + test every app
        working-directory: web
        run: |
          source ../deploy/lib/web-apps.sh
          apps="$(web_app_ids)"
          [ -n "$apps" ] || { echo "no web apps found"; exit 1; }
          for app in $apps; do
            echo "::group::$app"
            pnpm -F "$app" lint
            pnpm -F "$app" build
            pnpm -F "$app" test
            echo "::endgroup::"
          done

      # The store frame renderer (store-presence-and-support-pages.md §3.2). Its end-to-end test frames
      # a synthetic bezel in real Chromium, so the runner needs the headless shell playwright-core
      # pins — it downloads no browser on install.
      - name: Lint + typecheck store-frame
        working-directory: web
        run: pnpm -F @tenshu/store-frame lint && pnpm -F @tenshu/store-frame typecheck

      - name: Test store-frame
        working-directory: web
        run: |
          pnpm -F @tenshu/store-frame exec playwright-core install --with-deps --only-shell chromium
          pnpm -F @tenshu/store-frame test

      # The listing copy and its tooling (scripts/store-listing.py) — also the pre-commit hook's check.
      - name: Store listings — limits, copy rules, claims
        run: |
          python3 scripts/store-listing.py check
          python3 scripts/test_store_listing.py
          python3 scripts/test_store_webp.py
          python3 scripts/lib/data_safety.py check
          python3 scripts/test_data_safety.py
          python3 scripts/test_public_export.py

      - name: Upload apex dist
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apex-dist
          path: web/apex/dist
          if-no-files-found: ignore
