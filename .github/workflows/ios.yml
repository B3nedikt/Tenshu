name: iOS

# iOS K/N build + test gate (docs/proposals/ios-proxy-architecture.md).
# The iOS targets are declared in every shared module; without a lane that compiles
# and tests them, breakage surfaces only when someone opens Xcode ("declared-but-unbuilt
# platform rots invisibly"). This lane compiles + tests the shared K/N surface and links every app's
# own `TenshuSdk` framework (`:tenshu-sdk-ios-<app>`,
# docs/proposals/ios-per-app-frameworks.md) on every PR.
#
# Runs on a macOS runner (Kotlin/Native iOS compilation needs Xcode).
#
# ⚠⚠ This lane compiles Kotlin. It does NOT compile Swift: an app shell that never compiles,
# or a Kotlin change that breaks every app's Swift, merges with a green Kotlin gate. Hence the
# `ios-smoke.sh --build-only` step below: it is the only check in the repo that puts the
# SwiftUI shells in front of a compiler, and the SKIE-generated Swift surface — the thing
# most likely to break on a Kotlin or SKIE bump — exists nowhere else.
#
# ⚠ This cannot be a *required* status check: branch protection needs GitHub Pro or a
# public repo, and the API returns 403 on this plan. Two separate blockers, so check both
# before assuming this gate is enforced:
#   1. GitHub Actions billing (runners fail fast — see the "CI blocked by GitHub Actions
#      billing" note; a green tick carries no information while it holds),
#   2. branch protection availability, as above.
# While they hold, this file documents the gate and `scripts/ios-smoke.sh --build-only` is run
# locally on iOS-touching PRs.

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # The simulator tests, split over runners. ⚠⚠ Two things made one job 95 minutes AND red: every
  # module's Kotlin/Native test binary linked one after another on one 3-core runner, and the
  # simulator ran tests WHILE other modules linked beside it — starved, so real-time waits that
  # take milliseconds on a Mac ran out (10–30 s). Each shard now links first, then tests with one
  # worker, so nothing competes with the simulator. The shards are disjoint and together cover
  # every module with iOS tests (`scripts/ci/ios-test-shard.py`, from the build's own graph).
  ios-tests:
    name: ios tests (shard ${{ matrix.shard }}/3)
    runs-on: macos-latest
    # ⚠ Generous: macOS arm64 runners slow down under GitHub's capacity limits, and a shard cut off
    # mid-link reports nothing about its tests.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # ⚠ The NEWEST installed release Xcode, not the image default, and selected FIRST: Kotlin/Native
      # links against the selected Xcode's SDK too, so every step of every job builds with one
      # toolchain. The app shells are written against the current SDK (the maintainer builds with
      # Xcode 27); an older default fails to compile Swift that is fine there. Printed, so a failure
      # names the toolchain it ran on.
      - name: Use the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version

      # ⚠⚠ A PIN, not a fix. control-desktop / drive-desktop resolve an `FFM_JDK = 25` launcher
      # eagerly at CONFIGURATION time and there is no configure-on-demand, so every invocation
      # configures them. Without the pin this does not fail — the foojay resolver in
      # settings.gradle.kts auto-provisions 25 by DOWNLOADING it mid-configuration, which is why
      # JDK 17 alone was green. Pinning removes that per-run download and the network dependency.
      # 17 is listed LAST so it stays the daemon JVM. Full reasoning in android.yml.
      - name: Set up JDK 25 (desktop FFM toolchain) + JDK 17 (daemon + shared modules)
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            17
          distribution: 'temurin'

      # Gradle's own cache action: Gradle's user home (dependencies, wrapper, and the local BUILD
      # cache, so a compile already done for these inputs is not redone). It replaces setup-java's
      # `cache: gradle`, which kept dependencies only. ⚠ By default only the default branch WRITES
      # the cache; PRs read it — so a run on master is what warms it.
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's toolchain and platform-library caches (`~/.konan`), which every job would
      # otherwise download and rebuild — minutes per job. Keyed on the version catalog (the Kotlin
      # version lives there). Restored everywhere; SAVED only from master, so PRs neither race to
      # write it nor fill the repository's 10 GB cache allowance.
      - name: Restore Kotlin/Native (~/.konan)
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      # ⚠ setup-java installs into the hosted tool cache, which is NOT a location Gradle's
      # toolchain auto-detection scans — so the 25 above is invisible to `launcherFor` without
      # this. `fromEnv` takes env var NAMES; setup-java exports JAVA_HOME_<version>_<arch> and
      # the arch differs per runner (ubuntu = X64, macos-latest = ARM64), so both spellings are
      # listed. Unset names are skipped silently (verified), so the unused half costs nothing.
      #
      # ⚠ And a heap and worker budget for THIS runner (3 cores, 7 GB), not the maintainer's Mac
      # that `gradle.properties` is tuned for: a user-home `gradle.properties` overrides the
      # project's.
      - name: Register both JDKs with Gradle toolchain detection; fit the build to the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_25_ARM64,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
          org.gradle.workers.max=3
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1536m
          kotlin.native.jvmArgs=-Xmx3g
          PROPS

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pick this shard's modules
        run: |
          ./gradlew help -q --no-configuration-cache -Ptenshu.projectGraph=build/project-graph.json
          echo "LINK_TASKS=$(python3 scripts/ci/ios-test-shard.py build/project-graph.json $(( ${{ matrix.shard }} - 1 )) 3 link)" >> "$GITHUB_ENV"
          echo "TEST_TASKS=$(python3 scripts/ci/ios-test-shard.py build/project-graph.json $(( ${{ matrix.shard }} - 1 )) 3 test)" >> "$GITHUB_ENV"

      # Every test binary of the shard, in parallel. Compiles only: nothing runs on the simulator yet.
      - name: Link the shard's iOS test binaries
        run: ./gradlew $LINK_TASKS --continue --stacktrace

      # Runs commonTest + iosTest for the shard's modules on the simulator, ONE at a time: the
      # binaries above are up to date, so this is test execution alone. `--continue`: every failing
      # module is reported, not just the first. The `-proxy` / `-test-utils` modules are gated out
      # at the root build (proxy code runs on Control-on-iOS); see build.gradle.kts.
      - name: Run the shard's iOS simulator tests
        run: ./gradlew $TEST_TASKS --continue --stacktrace --max-workers=1

      - name: Save Kotlin/Native (~/.konan)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-report-${{ matrix.shard }}
          path: "**/build/reports/tests/**"

  # The apps: each TenshuSdk framework linked, then each Swift shell compiled against it.
  # Independent of the tests above, so it runs beside them. ⚠ In TWO halves: all ten in one job
  # took ~43 min of framework links plus ~4 min per Swift shell, past any sane timeout. Drive and
  # Photos (the slowest shells) sit in different halves. ⚠⚠ Together the halves must be exactly
  # `ios-smoke.sh --build-only`'s default list; the first step checks that, so an app added to
  # the script cannot silently go uncompiled here.
  ios-apps:
    name: ios apps (${{ matrix.apps }})
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        apps: ["control drive fit timeline maps", "photos contacts home mia calendar"]
    steps:
      - uses: actions/checkout@v4

      # ⚠ The NEWEST installed release Xcode, not the image default, and selected FIRST: Kotlin/Native
      # links against the selected Xcode's SDK too, so every step of every job builds with one
      # toolchain. The app shells are written against the current SDK (the maintainer builds with
      # Xcode 27); an older default fails to compile Swift that is fine there. Printed, so a failure
      # names the toolchain it ran on.
      - name: Use the newest installed Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE 'beta|release_candidate' | sort -V | tail -1)"
          [ -n "$newest" ] && sudo xcode-select -s "$newest"
          xcodebuild -version

      # ⚠⚠ A PIN, not a fix. control-desktop / drive-desktop resolve an `FFM_JDK = 25` launcher
      # eagerly at CONFIGURATION time and there is no configure-on-demand, so every invocation
      # configures them. Without the pin this does not fail — the foojay resolver in
      # settings.gradle.kts auto-provisions 25 by DOWNLOADING it mid-configuration, which is why
      # JDK 17 alone was green. Pinning removes that per-run download and the network dependency.
      # 17 is listed LAST so it stays the daemon JVM. Full reasoning in android.yml.
      - name: Set up JDK 25 (desktop FFM toolchain) + JDK 17 (daemon + shared modules)
        uses: actions/setup-java@v4
        with:
          java-version: |
            25
            17
          distribution: 'temurin'

      # Gradle's own cache action: Gradle's user home (dependencies, wrapper, and the local BUILD
      # cache, so a compile already done for these inputs is not redone). It replaces setup-java's
      # `cache: gradle`, which kept dependencies only. ⚠ By default only the default branch WRITES
      # the cache; PRs read it — so a run on master is what warms it.
      - name: Set up Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      # Kotlin/Native's toolchain and platform-library caches (`~/.konan`), which every job would
      # otherwise download and rebuild — minutes per job. Keyed on the version catalog (the Kotlin
      # version lives there). Restored everywhere; SAVED only from master, so PRs neither race to
      # write it nor fill the repository's 10 GB cache allowance.
      - name: Restore Kotlin/Native (~/.konan)
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-

      # ⚠ setup-java installs into the hosted tool cache, which is NOT a location Gradle's
      # toolchain auto-detection scans — so the 25 above is invisible to `launcherFor` without
      # this. `fromEnv` takes env var NAMES; setup-java exports JAVA_HOME_<version>_<arch> and
      # the arch differs per runner (ubuntu = X64, macos-latest = ARM64), so both spellings are
      # listed. Unset names are skipped silently (verified), so the unused half costs nothing.
      #
      # ⚠ And a heap and worker budget for THIS runner (3 cores, 7 GB), not the maintainer's Mac
      # that `gradle.properties` is tuned for: a user-home `gradle.properties` overrides the
      # project's.
      - name: Register both JDKs with Gradle toolchain detection; fit the build to the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'PROPS'
          org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_25_ARM64,JAVA_HOME_17_X64,JAVA_HOME_17_ARM64
          org.gradle.workers.max=3
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx1536m
          kotlin.native.jvmArgs=-Xmx3g
          PROPS

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Proves each app's Kotlin links into its framework: one debug simulator
      # slice per app, which is what the Swift step below links against
      # (ios-per-app-frameworks.md §8.2). Release device links are ~5 min each
      # and are proved per app by `scripts/ios-archive.sh`, not here.
      - name: The two halves are exactly ios-smoke's app list
        run: |
          script="$(sed -n 's/^    APPS=(\(control drive .*timeline.*\))$/\1/p' scripts/ios-smoke.sh | tr ' ' '\n' | sort | xargs)"
          halves="$(echo "control drive fit timeline maps photos contacts home mia calendar" | tr ' ' '\n' | sort | xargs)"
          echo "ios-smoke --build-only: $script"
          echo "the two halves:         $halves"
          [ -n "$script" ] && [ "$script" = "$halves" ] || { echo "::error::ios.yml's ios-apps halves do not match scripts/ios-smoke.sh's --build-only list"; exit 1; }

      - name: Link this half's TenshuSdk frameworks (simulator, debug)
        run: ./gradlew --stacktrace $(for app in ${{ matrix.apps }}; do echo ":tenshu-sdk-ios-$app:linkDebugFrameworkIosSimulatorArm64"; done)

      # `ios-smoke.sh` regenerates each .xcodeproj from its project.yml before
      # building; xcodegen is not preinstalled on the runner image.
      - name: Install xcodegen
        run: brew install xcodegen


      # The Swift half. Compiles every app shell against its framework just
      # linked, on the SIMULATOR sdk — so no signing identity, no device, and no
      # Apple team is needed (see the script's own note on why `generic/platform=iOS`
      # would put this gate out of CI's reach).
      #
      # ⚠ Each app's Xcode prebuild relinks its framework itself rather than
      # trusting the step above (`scripts/ios-build-sdk.sh <app>`; a stale framework
      # tests yesterday's API), and Gradle serves it from the work already done.
      #
      # ⚠ Not redundant with that step either: linking proves the *Kotlin* side
      # links, while this proves the Swift that consumes it still typechecks. A
      # Kotlin change that breaks linking is caught above; an app shell whose Swift
      # never compiles is caught only here.
      - name: Compile this half's iOS app shells (Swift)
        run: scripts/ios-smoke.sh --build-only ${{ matrix.apps }}

      - name: Save Kotlin/Native (~/.konan)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
